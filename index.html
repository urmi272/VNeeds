<!DOCTYPE html>
<html lang="en">
<head>
  <script>window.__vneedsLoadTimer = setTimeout(function () {
    var b = document.getElementById("slowLoadBanner");
    if (b) b.style.display = "block";
  }, 7000);</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VNeeds</title>
  <link rel="stylesheet" href="style.css">
  <!-- Preconnect + preload: fetch Firebase scripts in parallel instead of one-by-one, so slow/mobile connections don't stall on sequential downloads -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preload" href="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js" as="script">
  <link rel="preload" href="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js" as="script">
  <link rel="preload" href="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js" as="script">
  <link rel="preload" href="js/firebase-config.js" as="script">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="slowLoadBanner" style="display:none;position:fixed;top:0;left:0;right:0;background:#ffdd57;color:#332b00;padding:10px 14px;text-align:center;font-family:sans-serif;font-size:14px;z-index:99999;">⏳ Taking longer than usual to load (this happens on slow mobile data) — <a href="javascript:location.reload()" style="color:#332b00;font-weight:700;">Tap to reload</a></div>
  <div id="landing" class="page active">
    <div class="logo">
      <img src="logo.png" alt="VNeeds Logo" class="logo-img">
    </div>
    <h1>Welcome to VNeeds</h1>
    <p>Turn your hostel needs into quick deals - anytime, anywhere.</p>
    <div class="options">
      <button onclick="goBuy()">Buy</button>
      <button onclick="goSell()">Sell</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script>clearTimeout(window.__vneedsLoadTimer); var __b = document.getElementById("slowLoadBanner"); if (__b) __b.style.display = "none";</script>
  <script>
    function goBuy() {
      auth.onAuthStateChanged(user => {
        window.location.href = user ? "buy.html" : "login.html";
      });
    }
    function goSell() {
      auth.onAuthStateChanged(user => {
        window.location.href = user ? "sell.html" : "login.html";
      });
    }
  </script>
</body>
</html>
