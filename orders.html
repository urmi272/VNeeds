<!DOCTYPE html>
<html lang="en">
<head>
  <script>window.__vneedsLoadTimer = setTimeout(function () {
    var b = document.getElementById("slowLoadBanner");
    if (b) b.style.display = "block";
  }, 7000);</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders - VNeeds</title>
  <link rel="stylesheet" href="style.css">
  <!-- Preconnect + preload: fetch Firebase scripts in parallel instead of one-by-one, so slow/mobile connections don't stall on sequential downloads -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preload" href="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js" as="script">
  <link rel="preload" href="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js" as="script">
  <link rel="preload" href="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js" as="script">
  <link rel="preload" href="js/firebase-config.js" as="script">
  <link rel="preload" href="js/ui.js" as="script">
  <link rel="preload" href="js/auth.js" as="script">
  <link rel="preload" href="js/orders.js" as="script">
  <link rel="preload" href="js/chat.js" as="script">
  <link rel="preload" href="js/ratings.js" as="script">
  <link rel="preload" href="js/notifications.js" as="script">
</head>
<body>
  <div id="slowLoadBanner" style="display:none;position:fixed;top:0;left:0;right:0;background:#ffdd57;color:#332b00;padding:10px 14px;text-align:center;font-family:sans-serif;font-size:14px;z-index:99999;">⏳ Taking longer than usual to load (this happens on slow mobile data) — <a href="javascript:location.reload()" style="color:#332b00;font-weight:700;">Tap to reload</a></div>
  <header>
    <div class="logo"><img src="logo.png" alt="VNeeds Logo" class="logo-img"></div>
    <div class="nav-actions">
      <a href="buy.html"><button>⬅ Back</button></a>
      <a href="profile.html"><button class="icon-btn" title="Profile" aria-label="Profile">👤</button></a>
      <div class="notif-wrap">
        <button id="notifBell" class="icon-btn" title="Notifications" aria-label="Notifications">🔔<span id="notifBadge" class="notif-badge"></span></button>
        <div id="notifDropdown" class="notif-dropdown"></div>
      </div>
      <button class="icon-btn" onclick="doLogout()" title="Logout" aria-label="Logout">🚪</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="buying" onclick="switchTab('buying')">🛒 Buying</button>
    <button class="tab-btn" data-tab="selling" onclick="switchTab('selling')">🏷 Selling</button>
    <button class="tab-btn" data-tab="messages" onclick="switchTab('messages')">💬 Messages</button>
  </div>

  <div id="buyingList" class="order-list"></div>
  <div id="sellingList" class="order-list" style="display:none;"></div>
  <div id="messagesList" class="order-list" style="display:none;"></div>

  <!-- Chat / order detail modal -->
  <div id="chatModal" class="modal" aria-hidden="true">
    <div class="modal-content chat-modal">
      <button class="close-btn" onclick="closeChat()">×</button>
      <h3 id="chatTitle"></h3>
      <p id="chatMeta" class="rating-line muted"></p>

      <div id="statusActions" class="status-actions"></div>

      <div id="chatMessages" class="chat-messages"></div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="Type a message...">
        <button onclick="sendChatMessage()">Send</button>
      </div>

      <div id="ratingSection" class="rating-section" style="display:none;">
        <h4>Rate this product</h4>
        <div id="starPicker"></div>
        <textarea id="ratingComment" placeholder="Leave a comment (optional)"></textarea>
        <button onclick="submitOrderRating()">Submit Rating</button>
      </div>
    </div>
  </div>

  <div id="toastContainer"></div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script>clearTimeout(window.__vneedsLoadTimer); var __b = document.getElementById("slowLoadBanner"); if (__b) __b.style.display = "none";</script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/ratings.js"></script>
  <script src="js/notifications.js"></script>

  <script>
    initDarkMode();
    let me = null, unsubMessages = null, activeOrder = null;

    requireAuth(async (user) => {
      me = user;
      initNotificationBell(user.uid);
      await refreshOrders();
    });

    function doLogout() { logout().then(() => window.location.href = "index.html"); }

    function switchTab(tab) {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
      document.getElementById("buyingList").style.display = tab === "buying" ? "grid" : "none";
      document.getElementById("sellingList").style.display = tab === "selling" ? "grid" : "none";
      document.getElementById("messagesList").style.display = tab === "messages" ? "grid" : "none";
    }

    function statusBadge(status) {
      const map = { pending: "⏳ Pending", confirmed: "✅ Confirmed", completed: "🎉 Completed", cancelled: "❌ Cancelled" };
      return `<span class="stock-badge ${status === 'cancelled' ? 'out' : 'in'}">${map[status] || status}</span>`;
    }

    function orderCard(o) {
      const other = o.role === "buyer" ? o.sellerName : o.buyerName;
      return `
        <div class="product order-card" onclick='openChat(${JSON.stringify(o).replace(/'/g, "&apos;")})'>
          <img src="${safeImageSrc(o.productImg)}">
          <h4>${escapeHtml(o.productName)}</h4>
          <p>₹${Number(o.price) || 0} · ${escapeHtml((o.paymentMethod || "").toUpperCase())}</p>
          <p class="rating-line muted">${o.role === "buyer" ? "Seller" : "Buyer"}: ${escapeHtml(other)}</p>
          ${statusBadge(o.status)}
        </div>`;
    }

    function conversationCard(c) {
      const other = c.role === "buyer" ? c.sellerName : c.buyerName;
      const withOrder = { ...c, kind: "conversation" };
      return `
        <div class="product order-card" onclick='openChat(${JSON.stringify(withOrder).replace(/'/g, "&apos;")})'>
          <img src="${safeImageSrc(c.productImg)}">
          <h4>${escapeHtml(c.productName)}</h4>
          <p>₹${Number(c.price) || 0}</p>
          <p class="rating-line muted">${c.role === "buyer" ? "Seller" : "Buyer inquiry"}: ${escapeHtml(other)}</p>
          <span class="stock-badge in">💬 Chat</span>
        </div>`;
    }

    async function refreshOrders() {
      showSkeletons(document.getElementById("buyingList"), 2);
      showSkeletons(document.getElementById("sellingList"), 2);
      showSkeletons(document.getElementById("messagesList"), 2);

      const bC = document.getElementById("buyingList"), sC = document.getElementById("sellingList"), mC = document.getElementById("messagesList");

      // Fetched independently — a permissions/network problem with one
      // (e.g. conversations) should never leave the other lists stuck
      // on their loading skeleton forever.
      try {
        const { buying, selling } = await fetchOrdersFor(me.uid);
        buying.length ? bC.innerHTML = buying.map(orderCard).join("") : emptyState(bC, "🛒", "You haven't ordered anything yet.");
        selling.length ? sC.innerHTML = selling.map(orderCard).join("") : emptyState(sC, "🏷", "No orders on your listings yet.");
      } catch (err) {
        console.error("Couldn't load orders:", err);
        emptyState(bC, "⚠", "Couldn't load orders: " + err.message);
        emptyState(sC, "⚠", "Couldn't load orders: " + err.message);
        showToast("⚠ Couldn't load orders: " + err.message);
      }

      try {
        const conversations = await fetchConversationsFor(me.uid);
        conversations.length ? mC.innerHTML = conversations.map(conversationCard).join("") : emptyState(mC, "💬", "No conversations yet. Chat with a seller from any product page!");
      } catch (err) {
        console.error("Couldn't load conversations:", err);
        emptyState(mC, "⚠", "Couldn't load messages: " + err.message);
        showToast("⚠ Couldn't load messages: " + err.message);
      }
    }

    function openChat(order) {
      activeOrder = order;
      const isConversation = order.kind === "conversation";

      document.getElementById("chatTitle").innerText = order.productName;
      document.getElementById("chatMeta").innerText = isConversation
        ? `${order.role === "buyer" ? "Seller" : "Buyer"}: ${order.role === "buyer" ? order.sellerName : order.buyerName} · ₹${order.price}`
        : `${order.role === "buyer" ? "Seller" : "Buyer"}: ${order.role === "buyer" ? order.sellerName : order.buyerName} · ₹${order.price} · ${statusText(order.status)}`;

      const actions = document.getElementById("statusActions");
      actions.innerHTML = "";
      if (!isConversation && order.role === "seller" && order.status === "pending") {
        actions.innerHTML = `<button onclick="setStatus('confirmed')">✅ Confirm Order</button>
                              <button onclick="setStatus('cancelled')">❌ Cancel Order</button>`;
      } else if (!isConversation && order.role === "seller" && order.status === "confirmed") {
        actions.innerHTML = `<button onclick="setStatus('completed')">🎉 Mark Completed</button>`;
      }

      const ratingSection = document.getElementById("ratingSection");
      ratingSection.style.display = (!isConversation && order.role === "buyer" && order.status === "completed") ? "block" : "none";
      if (ratingSection.style.display === "block") {
        document.getElementById("starPicker").innerHTML = starPickerHTML("orderStarPicker");
        window.selectedStars = 0;
        bindStarPicker("orderStarPicker", (v) => window.selectedStars = v);
      }

      if (unsubMessages) unsubMessages();
      unsubMessages = isConversation
        ? watchConvMessages(order.id, renderMessages, (err) => { console.error(err); showToast("⚠ Couldn't load messages: " + err.message); })
        : watchMessages(order.id, renderMessages);

      document.getElementById("chatModal").style.display = "flex";
      document.getElementById("chatModal").setAttribute("aria-hidden", "false");
    }

    function statusText(s) {
      return { pending: "⏳ Pending", confirmed: "✅ Confirmed", completed: "🎉 Completed", cancelled: "❌ Cancelled" }[s] || s;
    }

    function renderMessages(messages) {
      const box = document.getElementById("chatMessages");
      box.innerHTML = messages.length ? messages.map(m => `
        <div class="chat-bubble ${m.senderUid === me.uid ? 'mine' : ''}">
          <span class="chat-sender">${m.senderUid === me.uid ? 'You' : escapeHtml(m.senderName)}</span>${escapeHtml(m.text)}
        </div>`).join("") : `<p class="rating-line muted" style="text-align:center;">Say hello 👋</p>`;
      box.scrollTop = box.scrollHeight;
    }

    async function sendChatMessage() {
      const input = document.getElementById("chatInput");
      const text = input.value.trim();
      if (!text || !activeOrder) return;
      const otherUid = activeOrder.role === "buyer" ? activeOrder.sellerUid : activeOrder.buyerUid;
      try {
        if (activeOrder.kind === "conversation") {
          await sendConvMessage(activeOrder.id, me, text, otherUid, activeOrder.productName);
        } else {
          await sendMessage(activeOrder.id, me, text, otherUid);
        }
        input.value = "";
      } catch (err) {
        console.error("Couldn't send message:", err);
        showToast("⚠ Message didn't send: " + err.message);
      }
    }
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("chatInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") sendChatMessage();
      });
    });

    async function setStatus(status) {
      await updateOrderStatus(activeOrder.id, status);
      activeOrder.status = status;
      showToast("Order status updated");
      closeChat();
      refreshOrders();
    }

    async function submitOrderRating() {
      if (!window.selectedStars) { showToast("⚠ Please select a star rating"); return; }
      const comment = document.getElementById("ratingComment").value.trim();
      await submitRating(activeOrder.productId, me.uid, window.selectedStars, comment, activeOrder.id);
      showToast("⭐ Thanks for rating!");
      closeChat();
    }

    function closeChat() {
      if (unsubMessages) unsubMessages();
      document.getElementById("chatModal").style.display = "none";
      document.getElementById("chatModal").setAttribute("aria-hidden", "true");
    }
  </script>
</body>
</html>
