<!DOCTYPE html>
<html lang="en">
<head>
  <script>window.__vneedsLoadTimer = setTimeout(function () {
    var b = document.getElementById("slowLoadBanner");
    if (b) b.style.display = "block";
  }, 7000);</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VNeeds - Buy</title>
  <link rel="stylesheet" href="style.css">
  <!-- Preconnect + preload: fetch Firebase scripts in parallel instead of one-by-one, so slow/mobile connections don't stall on sequential downloads -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preload" href="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js" as="script">
  <link rel="preload" href="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js" as="script">
  <link rel="preload" href="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js" as="script">
  <link rel="preload" href="js/firebase-config.js" as="script">
  <link rel="preload" href="js/ui.js" as="script">
  <link rel="preload" href="js/auth.js" as="script">
  <link rel="preload" href="js/products.js" as="script">
  <link rel="preload" href="js/wishlist.js" as="script">
  <link rel="preload" href="js/orders.js" as="script">
  <link rel="preload" href="js/ratings.js" as="script">
  <link rel="preload" href="js/notifications.js" as="script">
</head>
<body>
  <div id="slowLoadBanner" style="display:none;position:fixed;top:0;left:0;right:0;background:#ffdd57;color:#332b00;padding:10px 14px;text-align:center;font-family:sans-serif;font-size:14px;z-index:99999;">⏳ Taking longer than usual to load (this happens on slow mobile data) — <a href="javascript:location.reload()" style="color:#332b00;font-weight:700;">Tap to reload</a></div>
  <div id="dashboard" class="page active">
    <header>
      <div class="logo"><img src="logo.png" alt="VNeeds Logo" class="logo-img"></div>

      <div class="search-container">
        <span class="search-icon">🔍</span>
        <input type="text" id="search" placeholder="Search products..." onkeyup="filterProducts()">
      </div>

      <div class="nav-actions">
        <button class="mobile-toggle" onclick="toggleSidebar()">☰</button>
        <a href="sell.html"><button>+ Sell</button></a>
        <a href="myproducts.html"><button>📦 My Products</button></a>
        <a href="orders.html"><button>🧾 Orders</button></a>
        <button onclick="showPage('wishlistPage')">❤️ Wishlist</button>

        <div class="notif-wrap">
          <button id="notifBell">🔔<span id="notifBadge" class="notif-badge"></span></button>
          <div id="notifDropdown" class="notif-dropdown"></div>
        </div>

        <button id="darkToggle">🌙</button>
        <button onclick="doLogout()">Logout</button>
      </div>
    </header>

    <aside>
      <div class="filter-section">
        <h3 onclick="toggleSection(this)">Categories <span class="chevron">▾</span></h3>
        <ul>
          <li onclick="filterCategory('all')">All</li>
          <li onclick="filterCategory('food')">🍜 Food</li>
          <li onclick="filterCategory('clothes')">👕 Clothes</li>
          <li onclick="filterCategory('cosmetics')">💄 Cosmetics</li>
        </ul>
      </div>
      <div class="filter-section">
        <h3 onclick="toggleSection(this)">Your Block <span class="chevron">▾</span></h3>
        <ul id="blockCategory"></ul>
      </div>
      <div class="filter-section">
        <h3 onclick="toggleSection(this)">Price <span class="chevron">▾</span></h3>
        <div class="price-filter">
          <input type="range" id="priceRange" min="0" max="500" step="10" oninput="filterByPrice()">
          <span id="priceValue">500</span>
        </div>
      </div>
    </aside>

    <div id="sidebarOverlay" onclick="closeSidebar()"></div>

    <main id="productList"></main>
  </div>

  <div id="wishlistPage" class="page">
    <header>
      <div class="logo"><span style="color:var(--color2)">VNeeds</span></div>
      <div><button onclick="showPage('dashboard')">⬅ Back</button></div>
    </header>
    <h2>Your Wishlist ❤️</h2>
    <div id="wishlistList" class="wishlist-container"></div>
  </div>

  <!-- Product Details Modal -->
  <div id="productModal" class="modal" aria-hidden="true" role="dialog">
    <div class="modal-content" role="document">
      <button id="modalCloseBtn" class="close-btn" aria-label="Close modal">×</button>
      <img id="modalImg" alt="Product image">
      <h3 id="modalName"></h3>
      <p id="modalRating" class="rating-line"></p>
      <p id="modalPrice"></p>
      <p id="modalDesc"></p>
      <p id="modalSeller"></p>
      <p id="modalUpi"></p>

      <div class="payment-options">
        <button id="cashBtn">💵 Cash Payment</button>
        <button id="razorpayBtn">💳 Pay Online</button>
        <button id="upiBtn">📲 UPI (Manual)</button>
      </div>
      <a id="upiDeepLink" href="#" rel="noopener noreferrer" style="display:none">Open UPI</a>
      <div id="upiChooser" style="display:none; margin-top:10px; font-size:14px;">
        <div style="margin-bottom:6px;">Or open with:</div>
        <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center;">
          <a id="gpayLink" href="#" rel="noopener noreferrer">GPay</a>
          <a id="phonepeLink" href="#" rel="noopener noreferrer">PhonePe</a>
          <a id="paytmLink" href="#" rel="noopener noreferrer">Paytm</a>
          <button id="copyUpiBtn" type="button">Copy UPI</button>
        </div>
        <img id="upiQr" alt="UPI QR" style="display:none; max-width:180px; margin-top:8px; border-radius:8px;">
      </div>

      <div class="modal-nav">
        <button id="prevBtn">⬅ Prev</button>
        <button id="nextBtn">Next ➡</button>
      </div>
    </div>
  </div>

  <div id="toastContainer"></div>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script>clearTimeout(window.__vneedsLoadTimer); var __b = document.getElementById("slowLoadBanner"); if (__b) __b.style.display = "none";</script>
  <script src="js/razorpay-config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/products.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/ratings.js"></script>
  <script src="js/notifications.js"></script>

  <script>
    initDarkMode();
    let me = null, myProfile = null, allProducts = [], wishlist = [];
    let currentProductList = [], currentProductIndex = -1, unsubscribeProducts = null;

    requireAuth(async (user, profile) => {
      me = user; myProfile = profile;
      initNotificationBell(user.uid);

      if (profile.block) {
        document.getElementById("blockCategory").innerHTML =
          `<li onclick="filterByBlock('${profile.block}')">🏢 ${profile.block}</li>`;
      } else {
        document.getElementById("blockCategory").innerHTML =
          `<li class="muted-item"><a href="block.html">📍 Set your block</a></li>`;
      }

      try {
        wishlist = await getWishlist(user.uid);
      } catch (err) {
        console.error("Failed to load wishlist:", err);
        wishlist = [];
      }
      showSkeletons(document.getElementById("productList"));

      unsubscribeProducts = watchProducts((products) => {
        allProducts = products;
        const blockMatches = profile.block ? products.filter(p => p.block === profile.block) : [];
        loadProducts(blockMatches.length ? blockMatches : products);
      });
    });

    function toggleSection(header) {
      header.parentElement.classList.toggle("collapsed");
    }

    function showPage(id) {
      document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
      document.getElementById(id).classList.add("active");
      if (id === "wishlistPage") loadWishlistView();
    }

    function doLogout() {
      if (unsubscribeProducts) unsubscribeProducts();
      logout().then(() => window.location.href = "index.html");
    }

    function productCardHTML(p, i) {
      const isWishlisted = wishlist.includes(p.id);
      return `
        <div class="product" style="animation-delay:${i * 0.05}s" onclick='openModal(${JSON.stringify(p).replace(/'/g, "&apos;")})'>
          ${isNew(p) ? `<span class="new-badge">New</span>` : ""}
          <img src="${p.img}" loading="lazy">
          <h4>${p.name}</h4>
          <p>₹${p.price}</p>
          ${p.ratingCount ? `<p class="rating-line">${starString(p.avgRating)} (${p.ratingCount})</p>` : `<p class="rating-line muted">No ratings yet</p>`}
          ${p.status === "out" ? `<p class="stock-badge out">🚫 Out of Stock</p>` : `<p class="stock-badge in">✅ Available</p>`}
          <span class="wishlist ${isWishlisted ? 'active' : ''}" onclick="handleWishlistClick(event, '${p.id}', this)">♥</span>
        </div>`;
    }

    let currentSort = "newest";
    function sortProducts(list) {
      const copy = [...list];
      if (currentSort === "price_low") copy.sort((a, b) => a.price - b.price);
      else if (currentSort === "price_high") copy.sort((a, b) => b.price - a.price);
      else if (currentSort === "rating") copy.sort((a, b) => (b.avgRating || 0) - (a.avgRating || 0));
      return copy;
    }
    function isNew(p) {
      if (!p.createdAt || !p.createdAt.toDate) return false;
      return (Date.now() - p.createdAt.toDate().getTime()) < 1000 * 60 * 60 * 48;
    }
    function onSortChange(val) { currentSort = val; loadProducts(currentProductList); }

    function loadProducts(list) {
      currentProductList = list;
      const container = document.getElementById("productList");
      const toolbar = `
        <div class="toolbar">
          <span>${list.length} item${list.length === 1 ? "" : "s"}</span>
          <select onchange="onSortChange(this.value)">
            <option value="newest" ${currentSort === "newest" ? "selected" : ""}>Newest first</option>
            <option value="price_low" ${currentSort === "price_low" ? "selected" : ""}>Price: Low to High</option>
            <option value="price_high" ${currentSort === "price_high" ? "selected" : ""}>Price: High to Low</option>
            <option value="rating" ${currentSort === "rating" ? "selected" : ""}>Top Rated</option>
          </select>
        </div>`;
      if (list.length === 0) {
        container.innerHTML = toolbar;
        const empty = document.createElement("div");
        emptyState(empty, "🔍", allProducts.length === 0
          ? `No products in the marketplace yet.`
          : `No products found`);
        if (allProducts.length === 0) {
          empty.innerHTML += `<button onclick="addDemoProducts()" style="margin-top:10px;padding:10px 20px;border-radius:8px;border:none;background:var(--primary);color:#fff;font-weight:700;cursor:pointer;">🌱 Add Sample Products</button>`;
        }
        container.appendChild(empty);
        return;
      }
      container.innerHTML = toolbar + sortProducts(list).map(productCardHTML).join("");
    }

    async function addDemoProducts() {
      await seedDemoProducts(me, myProfile.block || "");
      showToast("🌱 Sample products added!");
    }

    async function handleWishlistClick(e, id, el) {
      e.stopPropagation();
      try {
        const nowActive = await toggleWishlistItem(me.uid, id);
        wishlist = nowActive ? [...wishlist, id] : wishlist.filter(x => x !== id);
        el.classList.toggle("active", nowActive);
        showToast(nowActive ? "Added to wishlist" : "Removed from wishlist");
      } catch (err) {
        console.error("Wishlist error:", err);
        showToast("⚠ Couldn't update wishlist: " + err.message);
      }
    }

    async function loadWishlistView() {
      const container = document.getElementById("wishlistList");
      const items = allProducts.filter(p => wishlist.includes(p.id));
      currentProductList = items;
      if (!items.length) { emptyState(container, "✨", "No items yet. Start exploring products!"); return; }
      container.innerHTML = items.map(productCardHTML).join("");
    }

    function filterProducts() {
      const q = document.getElementById("search").value.toLowerCase();
      loadProducts(allProducts.filter(p => p.name.toLowerCase().includes(q)));
    }
    function filterCategory(cat) {
      loadProducts(cat === "all" ? allProducts : allProducts.filter(p => p.category === cat));
      if (window.innerWidth <= 768) closeSidebar();
    }
    function filterByBlock(block) {
      loadProducts(allProducts.filter(p => p.block === block));
      if (window.innerWidth <= 768) closeSidebar();
    }
    function filterByPrice() {
      const max = document.getElementById("priceRange").value;
      document.getElementById("priceValue").innerText = max;
      loadProducts(allProducts.filter(p => p.price <= max));
      if (window.innerWidth <= 768) closeSidebar();
    }

    // ----- Modal / order / rating flow -----
    function openModal(p) {
      currentProductIndex = currentProductList.findIndex(x => x.id === p.id);
      document.getElementById("modalImg").src = p.img;
      document.getElementById("modalName").innerText = p.name;
      document.getElementById("modalRating").innerText = p.ratingCount ? `${starString(p.avgRating)} (${p.ratingCount} ratings)` : "No ratings yet";
      document.getElementById("modalPrice").innerText = "₹" + p.price;
      document.getElementById("modalDesc").innerHTML = `${p.desc}<br><strong>Status:</strong> ${p.status === "out" ? "🚫 Out of Stock" : "✅ Available"}`;
      document.getElementById("modalSeller").innerText = "Seller: " + p.sellerName + (p.block ? " | Block: " + p.block : "");
      document.getElementById("modalUpi").innerText = "UPI ID: " + (p.upi || "Not provided");

      const cashBtn = document.getElementById("cashBtn"), upiBtn = document.getElementById("upiBtn"), rzpBtn = document.getElementById("razorpayBtn");
      const isMine = p.sellerUid === me.uid;
      const disabled = p.status === "out" || isMine;
      [cashBtn, upiBtn, rzpBtn].forEach(b => b.disabled = disabled);
      cashBtn.innerText = isMine ? "This is your listing" : (p.status === "out" ? "🚫 Out of Stock" : "💵 Cash Payment");
      upiBtn.style.display = isMine || p.status === "out" ? "none" : "inline-block";
      rzpBtn.style.display = isMine || p.status === "out" ? "none" : "inline-block";

      cashBtn.onclick = () => placeOrder(p, "cash");
      upiBtn.onclick = () => placeOrder(p, "upi");
      rzpBtn.onclick = () => payWithRazorpay(p);

      document.getElementById("productModal").style.display = "flex";
      document.getElementById("productModal").setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function payWithRazorpay(p) {
      if (!RAZORPAY_KEY_ID || RAZORPAY_KEY_ID.includes("XXXX")) {
        showToast("⚠ Razorpay isn't set up yet — see js/razorpay-config.js");
        return;
      }
      const rzp = new Razorpay({
        key: RAZORPAY_KEY_ID,
        amount: p.price * 100, // paise
        currency: "INR",
        name: "VNeeds",
        description: p.name,
        image: p.img,
        prefill: { name: me.displayName || "", email: me.email },
        theme: { color: "#5B4FE9" },
        handler: async function (response) {
          // NOTE: for a real production app, send response.razorpay_payment_id
          // to a small backend/cloud function to verify the signature before
          // trusting the payment. This client-only flow is fine for a
          // college project / demo but should not be trusted for real money
          // without that server-side check.
          await createOrder(p, me, "razorpay");
          showToast("✅ Payment successful! Order placed.");
          closeModal();
        },
        modal: {
          ondismiss: function () { showToast("Payment cancelled"); }
        }
      });
      rzp.on("payment.failed", function (resp) {
        showToast("❌ Payment failed: " + resp.error.description);
      });
      rzp.open();
    }

    async function placeOrder(p, method) {
      if (method === "upi" && p.upi) {
        const upiUrl = `upi://pay?pa=${encodeURIComponent(p.upi)}&pn=${encodeURIComponent(p.sellerName)}&am=${encodeURIComponent(p.price)}&cu=INR`;
        const a = document.getElementById("upiDeepLink");
        a.href = upiUrl; a.click();
        const q = `pa=${encodeURIComponent(p.upi)}&pn=${encodeURIComponent(p.sellerName)}&am=${encodeURIComponent(p.price)}&cu=INR`;
        document.getElementById("gpayLink").href = `intent://pay?${q}#Intent;scheme=upi;package=com.google.android.apps.nbu.paisa.user;end`;
        document.getElementById("phonepeLink").href = `intent://pay?${q}#Intent;scheme=upi;package=com.phonepe.app;end`;
        document.getElementById("paytmLink").href = `intent://pay?${q}#Intent;scheme=upi;package=net.one97.paytm;end`;
        document.getElementById("copyUpiBtn").onclick = async () => {
          try { await navigator.clipboard.writeText(p.upi); showToast("📋 UPI ID copied"); }
          catch { prompt("Copy this UPI ID:", p.upi); }
        };
        const qr = document.getElementById("upiQr");
        qr.src = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(upiUrl)}`;
        qr.style.display = "block";
        document.getElementById("upiChooser").style.display = "block";
      } else {
        showToast("💵 Pay in cash when you meet the seller.");
      }
      await createOrder(p, me, method);
      showToast("🧾 Order placed! Track it in Orders.");
    }

    function closeModal() {
      document.getElementById("productModal").style.display = "none";
      document.getElementById("productModal").setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }
    function nextProduct() {
      if (currentProductIndex < currentProductList.length - 1) openModal(currentProductList[++currentProductIndex]);
      else showToast("🚫 No more products");
    }
    function prevProduct() {
      if (currentProductIndex > 0) openModal(currentProductList[--currentProductIndex]);
      else showToast("🚫 Already at first product");
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
      document.getElementById("productModal").addEventListener("click", (e) => {
        if (e.target.id === "productModal") closeModal();
      });
      document.getElementById("prevBtn").addEventListener("click", prevProduct);
      document.getElementById("nextBtn").addEventListener("click", nextProduct);
      document.addEventListener("keydown", (e) => {
        if (document.getElementById("productModal").style.display !== "flex") return;
        if (e.key === "Escape") closeModal();
        else if (e.key === "ArrowLeft") prevProduct();
        else if (e.key === "ArrowRight") nextProduct();
      });
    });
  </script>
</body>
</html>
