<!DOCTYPE html>
<html lang="en">
<head>
  <script>window.__vneedsLoadTimer = setTimeout(function () {
    var b = document.getElementById("slowLoadBanner");
    if (b) b.style.display = "block";
  }, 7000);</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VNeeds - Sell</title>
  <link rel="stylesheet" href="style.css">
  <!-- Preconnect + preload: fetch Firebase scripts in parallel instead of one-by-one, so slow/mobile connections don't stall on sequential downloads -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preload" href="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js" as="script">
  <link rel="preload" href="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js" as="script">
  <link rel="preload" href="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js" as="script">
  <link rel="preload" href="js/firebase-config.js" as="script">
  <link rel="preload" href="js/ui.js" as="script">
  <link rel="preload" href="js/auth.js" as="script">
  <link rel="preload" href="js/products.js" as="script">
</head>
<body>
  <div id="slowLoadBanner" style="display:none;position:fixed;top:0;left:0;right:0;background:#ffdd57;color:#332b00;padding:10px 14px;text-align:center;font-family:sans-serif;font-size:14px;z-index:99999;">⏳ Taking longer than usual to load (this happens on slow mobile data) — <a href="javascript:location.reload()" style="color:#332b00;font-weight:700;">Tap to reload</a></div>
  <div id="sellForm" class="page active">
    <div class="logo"><img src="logo.png" alt="VNeeds Logo" class="logo-img" style="height:44px;"></div>
    <h2 id="formTitle">Sell a Product</h2>
    <form onsubmit="event.preventDefault(); submitForm();">
      <label for="productName">Product Name</label><br>
      <input type="text" id="productName" placeholder="Product Name"><br>

      <label for="productPrice">Price (₹)</label><br>
      <input type="number" id="productPrice" placeholder="Price (₹)"><br>

      <label for="productCategory">Category</label><br>
      <select id="productCategory">
        <option value="food">Food</option>
        <option value="clothes">Clothes</option>
        <option value="cosmetics">Cosmetics</option>
      </select><br>

      <label for="productDescription">Description</label><br>
      <textarea id="productDescription" placeholder="Product Description"></textarea><br>

      <label for="productImage">Upload Image</label><br>
      <input type="file" id="productImage" accept="image/*" onchange="previewImage(event)"><br>
      <img id="imagePreview" style="display:none; max-width:200px; margin:10px auto; border-radius:8px;"><br>

      <label for="sellerBlock">Your Block</label><br>
      <select id="sellerBlock">
        <option value="">-- Select Block --</option>
        <optgroup label="Girls">
          <option value="Girls Block 1">Girls Block 1</option>
          <option value="Girls Block 2">Girls Block 2</option>
          <option value="Girls Special Block">Girls Special Block</option>
        </optgroup>
        <optgroup label="Boys">
          <option value="Boys Block 1">Boys Block 1</option>
          <option value="Boys Block 2">Boys Block 2</option>
          <option value="Boys Block 3">Boys Block 3</option>
          <option value="Boys Block 4">Boys Block 4</option>
          <option value="Boys Block 5">Boys Block 5</option>
          <option value="Boys Block 6">Boys Block 6</option>
          <option value="Boys Block 7">Boys Block 7</option>
          <option value="Boys Block 8">Boys Block 8</option>
        </optgroup>
      </select><br>

      <label for="sellerUpi">Your UPI ID</label><br>
      <input type="text" id="sellerUpi" placeholder="example@upi"><br>

      <button type="submit" id="submitBtn">Add Product</button>
      <a href="buy.html"><button type="button">Cancel</button></a>
    </form>
  </div>

  <div id="toastContainer"></div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script>clearTimeout(window.__vneedsLoadTimer); var __b = document.getElementById("slowLoadBanner"); if (__b) __b.style.display = "none";</script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/products.js"></script>

  <script>
    initDarkMode();
    let me = null;
    let editingId = new URLSearchParams(window.location.search).get("edit");
    let existingImg = null;

    requireAuth(async (user, profile) => {
      me = user;
      document.getElementById("sellerBlock").value = profile.block || "";
      document.getElementById("sellerUpi").value = profile.upi || "";

      if (editingId) {
        const p = await getProduct(editingId);
        if (p && p.sellerUid === user.uid) {
          document.getElementById("formTitle").innerText = "Edit Product";
          document.getElementById("submitBtn").innerText = "Update Product";
          document.getElementById("productName").value = p.name;
          document.getElementById("productPrice").value = p.price;
          document.getElementById("productCategory").value = p.category;
          document.getElementById("productDescription").value = p.desc;
          document.getElementById("sellerBlock").value = p.block || "";
          document.getElementById("sellerUpi").value = p.upi || "";
          document.getElementById("imagePreview").src = p.img;
          document.getElementById("imagePreview").style.display = "block";
          existingImg = p.img;
        }
      }
    });

    function previewImage(event) {
      const preview = document.getElementById("imagePreview");
      preview.src = URL.createObjectURL(event.target.files[0]);
      preview.style.display = "block";
    }

    async function submitForm() {
      const name = document.getElementById("productName").value.trim();
      const price = document.getElementById("productPrice").value;
      const category = document.getElementById("productCategory").value;
      const desc = document.getElementById("productDescription").value.trim();
      const imgFile = document.getElementById("productImage").files[0];
      const block = document.getElementById("sellerBlock").value;
      const upi = document.getElementById("sellerUpi").value.trim();

      if (!name || !price || !category || !desc || !block || !upi || (!imgFile && !existingImg)) {
        showToast("⚠ Please fill all fields, select an image, block, and enter UPI ID");
        return;
      }

      await saveProfileField(me.uid, "block", block);
      await saveProfileField(me.uid, "upi", upi);

      try {
        if (editingId) {
          const fields = { name, price: parseInt(price), category, desc, block, upi };
          if (imgFile) fields.img = await resizeImage(imgFile, 500, 500, 0.5);
          await updateProduct(editingId, fields);
          showToast("✅ Product updated!");
        } else {
          await addProduct({ name, price: parseInt(price), category, desc, imgFile, block, upi }, me);
          showToast("✅ Product added successfully!");
        }
        setTimeout(() => window.location.href = "myproducts.html", 900);
      } catch (err) {
        showToast("⚠ " + err.message);
      }
    }
  </script>
</body>
</html>
